<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的訂單</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--accent:#f97316;--accent2:#ea580c;--ink:#1a1a2e;--ink2:#4a5568;--ink3:#a0aec0;--border:#e2e8f0;--surface:#fff;--bg:#fff7f0;--green:#10b981;--red:#ef4444;--teal:#06b6d4;--blue:#3b82f6;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);min-height:100vh;color:var(--ink);font-size:14px}
header{background:var(--ink);color:#fff;padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.hd-logo{font-weight:700;font-size:.95rem;display:flex;align-items:center;gap:8px}
.hd-right{display:flex;align-items:center;gap:10px}
.hd-nav a{color:rgba(255,255,255,.65);text-decoration:none;font-size:.78rem;padding:5px 10px;border-radius:6px}
.hd-nav a:hover{color:#fff;background:rgba(255,255,255,.1)}
.hd-btn{background:rgba(255,255,255,.12);border:none;color:#fff;padding:6px 12px;border-radius:7px;cursor:pointer;font-family:inherit;font-size:.76rem;font-weight:600}
#login-gate{max-width:420px;margin:60px auto;padding:0 20px}
.login-card{background:var(--surface);border-radius:18px;padding:32px;box-shadow:0 4px 32px rgba(249,115,22,.1)}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fg label{font-size:.7rem;font-weight:700;color:var(--ink2);letter-spacing:.04em}
.fc{padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.88rem;color:var(--ink);outline:none;width:100%}
.fc:focus{border-color:var(--accent)}
.btn{width:100%;padding:11px;border:none;border-radius:9px;font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer}
.btn-primary{background:var(--accent);color:#fff;margin-top:4px}
.btn-primary:hover{background:var(--accent2)}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--ink2);margin-top:8px}
.err-msg{background:#fef2f2;border:1px solid #fecaca;border-radius:7px;padding:9px 12px;font-size:.78rem;color:#991b1b;margin-bottom:10px;display:none}
.err-msg.show{display:block}
#main-content{display:none;max-width:760px;margin:0 auto;padding:18px 16px}
.welcome-bar{background:var(--surface);border-radius:14px;padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.welcome-name{font-weight:700;font-size:1rem}
.welcome-sub{font-size:.76rem;color:var(--ink3);margin-top:2px}
.stats-row{display:flex;gap:10px;flex-wrap:wrap}
.stat-pill{background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:5px 13px;font-size:.76rem;font-weight:600;color:var(--ink2)}
.stat-pill span{font-family:'DM Mono',monospace;color:var(--accent);font-size:.82rem}
.announce{background:linear-gradient(135deg,#fff7ed,#fef3c7);border:1.5px solid #fed7aa;border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:.82rem;color:#92400e;line-height:1.6}
.tabs-wrap{background:var(--surface);border-radius:14px 14px 0 0;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.tabs{display:flex;border-bottom:2px solid var(--border)}
.tab{flex:1;padding:12px 8px;text-align:center;font-size:.82rem;font-weight:500;cursor:pointer;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab.active{color:var(--red);border-bottom-color:var(--red);font-weight:700}
.tab .cnt{display:inline-block;background:var(--red);color:#fff;font-size:.62rem;font-weight:700;padding:1px 5px;border-radius:10px;margin-left:3px}
.orders-wrap{background:var(--surface);border-radius:0 0 14px 14px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:14px;overflow:hidden}
.ord-card{border-bottom:2px solid var(--border)}
.ord-card:last-child{border-bottom:none}
.ord-meta{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#fafafa}
.ord-serial{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--ink3)}
.ord-date{font-size:.7rem;color:var(--ink3)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:.68rem;font-weight:700}
.b-red{background:#fef2f2;color:#991b1b}
.b-green{background:#ecfdf5;color:#065f46}
.b-blue{background:#eff6ff;color:#1d4ed8}
.b-teal{background:#ecfeff;color:#155e75}
.b-amber{background:#fffbeb;color:#92400e}
.b-gray{background:#f3f4f6;color:#374151;border:1px solid var(--border)}
.b-orange{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
.pay-prompt{padding:10px 14px;background:#fffbeb;border-bottom:1px solid #fde68a;font-size:.78rem;color:#92400e;line-height:1.7}
.pay-prompt strong{display:block;font-size:.8rem;margin-bottom:2px}
.item-hd{display:grid;grid-template-columns:52px 1fr 55px 75px 75px;gap:8px;padding:7px 14px;font-size:.65rem;color:var(--ink3);font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border);background:#fafafa}
.item-row{display:grid;grid-template-columns:52px 1fr 55px 75px 75px;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);align-items:start}
.item-row:last-of-type{border-bottom:none}
.item-row.stockout{background:#f9fafb}
.item-img{width:50px;height:50px;border-radius:8px;background:#f3f4f6;border:1px solid var(--border);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.item-img img{width:50px;height:50px;object-fit:cover}
.item-name{font-size:.85rem;font-weight:600;line-height:1.4}
.item-name.stockout{color:var(--ink3);text-decoration:line-through}
.item-spec{font-size:.72rem;color:var(--ink3);margin-top:2px}
.item-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.item-qty{font-size:.8rem;text-align:center;color:var(--ink2);padding-top:3px}
.item-qty.stockout{color:var(--ink3);text-decoration:line-through}
.item-price{font-family:'DM Mono',monospace;font-size:.79rem;text-align:right;color:var(--ink2);padding-top:3px}
.item-price.stockout{color:var(--ink3);text-decoration:line-through}
.item-total{font-family:'DM Mono',monospace;font-size:.9rem;font-weight:700;text-align:right;padding-top:3px;color:var(--accent)}
.item-total.zero{color:var(--ink3)}
.ord-foot{padding:10px 14px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:6px;background:#fafafa;border-top:1px solid var(--border)}
.ord-method{font-size:.74rem;color:var(--ink3)}
.ord-total-sub{font-size:.7rem;color:var(--ink3);text-align:right;margin-bottom:2px}
.ord-total{font-family:'DM Mono',monospace;font-size:1rem;font-weight:700;color:var(--red);text-align:right}
.ord-note{background:#fffbeb;padding:8px 14px;font-size:.76rem;color:#92400e;border-top:1px solid #fde68a}
.empty{text-align:center;padding:40px 20px;color:var(--ink3)}
.empty .ei{font-size:2.8rem;margin-bottom:10px}
.loading{text-align:center;padding:30px;color:var(--ink3)}
</style>
</head>
<body>
<header>
  <div class="hd-logo">🛒 <span id="hd-shop-name">團購管家</span></div>
  <div class="hd-right">
    <div class="hd-nav"><a href="shop.html">🛍️ 商城</a><a href="register.html">📝 註冊</a></div>
    <span style="font-size:.78rem;color:rgba(255,255,255,.6)" id="hd-user-label"></span>
    <button class="hd-btn" id="hd-logout-btn" onclick="logout()" style="display:none">登出</button>
  </div>
</header>

<div id="login-gate">
  <div class="login-card">
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:2.2rem;margin-bottom:8px">📦</div>
      <div style="font-size:1.1rem;font-weight:700">查看我的訂單</div>
      <div style="font-size:.78rem;color:var(--ink3);margin-top:4px">用您的手機號碼和密碼登入</div>
    </div>
    <div class="err-msg" id="login-err"></div>
    <div class="fg"><label>手機號碼</label><input class="fc" id="l-phone" placeholder="09xx-xxx-xxx" type="tel"></div>
    <div class="fg"><label>密碼</label><input class="fc" id="l-pw" type="password" placeholder="您設定的密碼" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn btn-primary" onclick="doLogin()">🔐 登入查看訂單</button>
    <button class="btn btn-outline" onclick="location.href='register.html'">✏️ 還沒有帳號？立即註冊</button>
  </div>
</div>

<div id="main-content">
  <div id="announce-bar" style="display:none" class="announce"></div>
  <div class="welcome-bar">
    <div>
      <div class="welcome-name" id="w-name">歡迎回來！</div>
      <div class="welcome-sub">以下是您目前的訂單狀況</div>
    </div>
    <div class="stats-row">
      <div class="stat-pill">訂單總數 <span id="s-total">0</span></div>
      <div class="stat-pill">待付款 <span id="s-unpaid">0</span></div>
      <div class="stat-pill">消費總額 <span id="s-amount">$0</span></div>
    </div>
  </div>
  <div class="tabs-wrap">
    <div class="tabs">
      <div class="tab active" id="tab-unpaid" onclick="setTab('unpaid')">待付款<span class="cnt" id="cnt-unpaid" style="display:none"></span></div>
      <div class="tab" id="tab-active" onclick="setTab('active')">處理中</div>
      <div class="tab" id="tab-all" onclick="setTab('all')">所有訂單</div>
    </div>
    <div class="orders-wrap" id="orders-container">
      <div class="loading">載入中...</div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAbxs_fRimdgHx3RQYSGAczSwu6lH-CL2Y",
  authDomain: "my-group-buy-63e36.firebaseapp.com",
  projectId: "my-group-buy-63e36",
  storageBucket: "my-group-buy-63e36.firebasestorage.app",
  messagingSenderId: "893197059676",
  appId: "1:893197059676:web:701fc2dd1e398836928899"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ordTotal = o => o.items.reduce((s,i) => s+(i.stockout?0:i.price*i.qty), 0);
const catEm = c => ({食品:'🥫',生鮮:'🥭',零食:'🍬',飲品:'🧃',保健:'💊',日用:'🧴',服飾:'👗',其他:'📦'}[c]||'📦');

let currentUser=null, allOrders=[], settings={}, curTab='unpaid';

async function init(){
  try{ const s=await getDoc(doc(db,'settings','main')); settings=s.exists()?s.data():{}; document.getElementById('hd-shop-name').textContent=settings.shopName||'團購管家'; }catch(e){}
  const saved=sessionStorage.getItem('gbp_user');
  if(saved){
    try{
      const u=JSON.parse(saved);
      const cSnap=await getDoc(doc(db,'customers',u.id));
      if(cSnap.exists()){currentUser=cSnap.data();showMain();return;}
    }catch(e){}
  }
}
init();

window.doLogin=async function(){
  const phone=document.getElementById('l-phone').value.trim();
  const pw=document.getElementById('l-pw').value;
  const err=document.getElementById('login-err'); err.classList.remove('show');
  if(!phone||!pw){err.textContent='請填寫手機號碼和密碼';err.classList.add('show');return;}
  try{
    const q=query(collection(db,'customers'),where('phone','==',phone),where('password','==',pw));
    const snap=await getDocs(q);
    if(snap.empty){err.textContent='手機號碼或密碼錯誤，請重試';err.classList.add('show');return;}
    currentUser=snap.docs[0].data();
    sessionStorage.setItem('gbp_user',JSON.stringify({id:currentUser.id,name:currentUser.name,phone:currentUser.phone}));
    showMain();
  }catch(e){err.textContent='登入失敗，請稍後再試';err.classList.add('show');}
};

function showMain(){
  document.getElementById('login-gate').style.display='none';
  document.getElementById('main-content').style.display='block';
  document.getElementById('hd-user-label').textContent=currentUser.name;
  document.getElementById('hd-logout-btn').style.display='';
  if(settings.announcement){document.getElementById('announce-bar').textContent=settings.announcement;document.getElementById('announce-bar').style.display='';}
  loadOrders();
}
window.logout=function(){sessionStorage.removeItem('gbp_user');location.reload();};

async function loadOrders(){
  document.getElementById('orders-container').innerHTML='<div class="loading">載入訂單中...</div>';
  try{
    const q=query(collection(db,'orders'),where('customerId','==',currentUser.id));
    const snap=await getDocs(q);
    allOrders=snap.docs.map(d=>d.data()).sort((a,b)=>b.id>a.id?1:-1);
    renderStats(); renderOrders();
  }catch(e){
    document.getElementById('orders-container').innerHTML='<div class="empty"><div class="ei">⚠️</div><p>載入失敗，請重新整理頁面</p></div>';
  }
}

function renderStats(){
  document.getElementById('w-name').textContent=`👋 ${currentUser.name}，歡迎回來！`;
  document.getElementById('s-total').textContent=allOrders.length;
  const unpaidCnt=allOrders.filter(o=>o.payStatus==='unpaid').length;
  document.getElementById('s-unpaid').textContent=unpaidCnt;
  document.getElementById('s-amount').textContent='$'+allOrders.reduce((s,o)=>s+ordTotal(o),0).toLocaleString();
  const cntEl=document.getElementById('cnt-unpaid');
  if(unpaidCnt>0){cntEl.textContent=unpaidCnt;cntEl.style.display='';}else{cntEl.style.display='none';}
}

window.setTab=function(tab){
  curTab=tab;
  ['unpaid','active','all'].forEach(t=>document.getElementById('tab-'+t).classList.toggle('active',t===tab));
  renderOrders();
};

function renderOrders(){
  let ords=allOrders;
  if(curTab==='unpaid') ords=allOrders.filter(o=>o.payStatus==='unpaid');
  if(curTab==='active') ords=allOrders.filter(o=>o.payStatus==='paid'&&o.shipStatus!=='done');
  const container=document.getElementById('orders-container');
  if(!ords.length){
    const msgs={unpaid:'沒有待付款訂單 🎉',active:'沒有處理中的訂單',all:'您還沒有訂單'};
    container.innerHTML=`<div class="empty"><div class="ei">📭</div><p>${msgs[curTab]||'沒有訂單'}<br><a href="shop.html" style="color:var(--accent);font-weight:600">前往商城選購</a></p></div>`;
    return;
  }
  const shipLabel=s=>({done:'<span class="badge b-green">✅ 已完成</span>',shipped:'<span class="badge b-teal">🚚 已出貨</span>',ready:'<span class="badge b-blue">📦 待出貨</span>',pending:'<span class="badge b-gray">確認中</span>'}[s]||'');
  const itemTags=(item,o)=>{
    if(item.stockout){
      return (item.stockoutDate?`<span class="badge b-amber" style="font-size:.64rem">📅 ${item.stockoutDate} 訂貨</span>`:'')+'<span class="badge b-red" style="font-size:.64rem">已斷貨</span>';
    }
    const tags=[];
    if(o.createdAt) tags.push(`<span class="badge" style="font-size:.64rem;background:#fff3cd;color:#856404;border:0.5px solid #ffc107">${o.createdAt} 訂貨</span>`);
    if(['ready','shipped','done'].includes(o.shipStatus)) tags.push('<span class="badge b-blue" style="font-size:.64rem">已到貨</span>');
    if(['ready','shipped','done'].includes(o.shipStatus)) tags.push('<span class="badge b-green" style="font-size:.64rem">已入庫</span>');
    if(['shipped','done'].includes(o.shipStatus)) tags.push('<span class="badge b-teal" style="font-size:.64rem">已出貨</span>');
    if(o.shipStatus==='pending') tags.push('<span class="badge b-gray" style="font-size:.64rem">確認中</span>');
    return tags.join('');
  };
  container.innerHTML=ords.map(o=>{
    const tot=ordTotal(o); const unpaid=o.payStatus==='unpaid';
    const hasStockout=o.items.some(i=>i.stockout);
    const origTot=o.items.reduce((s,i)=>s+i.price*i.qty,0);
    return`<div class="ord-card">
      <div class="ord-meta">
        <span class="ord-serial">${esc(o.serial)}</span>
        <span class="ord-date">${o.createdAt}</span>
        <span class="badge ${unpaid?'b-red':'b-green'}">${unpaid?'⏳ 待付款':'✅ 已付款'}</span>
        ${shipLabel(o.shipStatus)}
        ${hasStockout?'<span class="badge b-orange" style="font-size:.64rem">含斷貨商品</span>':''}
        <span class="badge b-gray" style="font-size:.64rem">${esc(o.payMethod||'')}</span>
        <span class="badge b-gray" style="font-size:.64rem">${esc(o.shipMethod||'')}</span>
      </div>
      ${unpaid?`<div class="pay-prompt"><strong>🏦 請完成付款</strong>${esc(settings.payInfo||'請聯絡團主確認付款方式')}${o.payMethod?`<br>付款方式：${esc(o.payMethod)}`:''}  </div>`:''}
      <div class="item-hd"><div>圖片</div><div>商品名稱</div><div style="text-align:center">數量</div><div style="text-align:right">單價</div><div style="text-align:right">小計</div></div>
      ${o.items.map(item=>{
        const isStockout=item.stockout===true;
        const subtotal=isStockout?0:item.price*item.qty;
        return`<div class="item-row${isStockout?' stockout':''}">
          <div class="item-img">${item.img?`<img src="${item.img}" alt="">`:catEm('')}</div>
          <div>
            <div class="item-name${isStockout?' stockout':''}">${esc(item.productName)}</div>
            ${item.spec?`<div class="item-spec">· ${esc(item.spec)}</div>`:''}
            <div class="item-tags">${itemTags(item,o)}</div>
          </div>
          <div class="item-qty${isStockout?' stockout':''}">×${item.qty}</div>
          <div class="item-price${isStockout?' stockout':''}">$${item.price.toLocaleString()}</div>
          <div class="item-total${isStockout?' zero':''}">$${subtotal.toLocaleString()}</div>
        </div>`;
      }).join('')}
      ${o.note?`<div class="ord-note">📝 備註：${esc(o.note)}</div>`:''}
      <div class="ord-foot">
        <div class="ord-method">寄送：${esc(o.shipMethod||'—')}　付款：${esc(o.payMethod||'—')}${hasStockout?'<br><span style="color:var(--ink3);font-size:.71rem">* 斷貨商品已從應付金額中扣除</span>':''}</div>
        <div>
          ${hasStockout&&origTot!==tot?`<div class="ord-total-sub" style="text-decoration:line-through">原價 $${origTot.toLocaleString()}</div>`:''}
          <div class="ord-total">應付 $${tot.toLocaleString()}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}
</script>
</body>
</html>
